<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenPOS · Ponto de venda</title>
    <meta name="theme-color" content="#4a5ee0" />
    <script>
      /* aplica o tema salvo antes de desenhar a página (evita piscar claro/escuro) */
      try {
        if (localStorage.getItem('openpos-theme') === 'dark') document.documentElement.dataset.theme = 'dark'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
